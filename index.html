<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TSUNAGU</title>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 18px 50px;
            background: #0F172A;
            color: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ============================================================
           CABEÇALHO
           ============================================================ */

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 4px;
        }

        .header p {
            margin: 8px 0 0;
            color: #CBD5E1;
        }

        /* ============================================================
           CARDS
           ============================================================ */

        .card {
            padding: 16px;
            background: #1E293B;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.30);
        }

        .manual-card {
            margin-top: 22px;
        }

        .section-title {
            margin: 0 0 6px;
            font-size: 19px;
        }

        .section-description {
            margin: 0 0 16px;
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.4;
        }

        /* ============================================================
           SCANNER
           ============================================================ */

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 14px;
            background: #000;
        }

        #status {
            margin-top: 18px;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.4;
            white-space: pre-line;
        }

        #participant {
            display: none;
            margin-top: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .info {
            background: #2563EB;
        }

        .success {
            background: #16A34A;
        }

        .warning {
            background: #D97706;
        }

        .error {
            background: #DC2626;
        }

        /* ============================================================
           ESTATÍSTICAS
           ============================================================ */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
        }

        .stat {
            padding: 20px 10px;
            background: #1E293B;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #38BDF8;
        }

        .stat-label {
            display: block;
            margin-top: 6px;
            color: #CBD5E1;
            font-size: 14px;
        }

        /* ============================================================
           BOTÕES
           ============================================================ */

        button {
            border: 0;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .50;
            cursor: default;
        }

        #startButton {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            font-size: 17px;
        }

        /* ============================================================
           BUSCA MANUAL
           ============================================================ */

        .search-box {
            display: flex;
            gap: 10px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: 1px solid #475569;
            border-radius: 12px;
            background: #0F172A;
            color: #FFFFFF;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #38BDF8;
        }

        #searchInput::placeholder {
            color: #64748B;
        }

        #searchButton {
            padding: 0 18px;
            background: #38BDF8;
            color: #082F49;
            font-size: 15px;
        }

        #searchMessage {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            line-height: 1.4;
        }

        #searchResults {
            margin-top: 15px;
        }

        /* ============================================================
           PARTICIPANTE DA BUSCA
           ============================================================ */

        .participant-card {
            margin-top: 12px;
            padding: 16px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #0F172A;
        }

        .participant-name {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
        }

        .participant-status {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pendente {
            background: rgba(56,189,248,.15);
            color: #7DD3FC;
        }

        .status-checkin {
            background: rgba(34,197,94,.15);
            color: #86EFAC;
        }

        .participant-date {
            margin-top: 10px;
            color: #94A3B8;
            font-size: 13px;
        }

        .manual-checkin-button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            background: #22C55E;
            color: #052E16;
            font-size: 14px;
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */

        @media (max-width: 420px) {

            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchButton {
                padding: 14px;
            }

        }

    </style>

</head>


<body>

<main class="container">

    <!-- ============================================================
         CABEÇALHO
         ============================================================ -->

    <header class="header">

        <h1>TSUNAGU</h1>

        <p>Sistema Inteligente de Gestão de Acesso</p>

    </header>


    <!-- ============================================================
         SCANNER QR
         ============================================================ -->

    <section class="card">

        <div id="reader"></div>

        <div
            id="status"
            class="info"
        >
            Clique em INICIAR CHECK-IN.
        </div>

        <div id="participant"></div>

        <button id="startButton">
            INICIAR CHECK-IN
        </button>

    </section>


    <!-- ============================================================
         ESTATÍSTICAS
         ============================================================ -->

    <section class="stats">

        <div class="stat">

            <span
                id="checked"
                class="stat-number"
            >
                -
            </span>

            <span class="stat-label">
                Check-ins
            </span>

        </div>


        <div class="stat">

            <span
                id="remaining"
                class="stat-number"
            >
                -
            </span>

            <span class="stat-label">
                Restantes
            </span>

        </div>

    </section>


    <!-- ============================================================
         CHECK-IN MANUAL
         ============================================================ -->

    <section class="card manual-card">

        <h2 class="section-title">
            Busca manual
        </h2>

        <p class="section-description">
            Localize o participante pelo nome caso não seja possível
            utilizar o QR Code.
        </p>


        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="Digite o nome do participante"
                autocomplete="off"
            >

            <button id="searchButton">
                BUSCAR
            </button>

        </div>


        <div id="searchMessage"></div>

        <div id="searchResults"></div>

    </section>

</main>


<script>

/***********************************************************************
 *
 * TSUNAGU
 * Interface MVP
 *
 * Scanner QR + Check-in + Estatísticas + Busca Manual
 *
 ***********************************************************************/


// =====================================================================
// CONFIGURAÇÃO
// =====================================================================

const API_URL =
    "https://script.google.com/macros/s/AKfycbx4JU4qIUQMvT4B3eKCnZ8gd-I5VNoV2bZ1SLAAdc2rD8YyXD6_mYckYE56TauVFzbP/exec";


// =====================================================================
// ELEMENTOS DO SCANNER
// =====================================================================

const statusElement =
    document.getElementById("status");

const participantElement =
    document.getElementById("participant");

const startButton =
    document.getElementById("startButton");

const checkedElement =
    document.getElementById("checked");

const remainingElement =
    document.getElementById("remaining");


// =====================================================================
// ELEMENTOS DA BUSCA MANUAL
// =====================================================================

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const searchMessage =
    document.getElementById("searchMessage");

const searchResults =
    document.getElementById("searchResults");


// =====================================================================
// ESTADO DO SCANNER
// =====================================================================

let scanner = null;

let scannerRunning = false;

let startingScanner = false;

let processing = false;


// =====================================================================
// EVENTOS
// =====================================================================

startButton.addEventListener(
    "click",
    startScanner
);


searchButton.addEventListener(
    "click",
    searchParticipants
);


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            searchParticipants();

        }

    }
);


// =====================================================================
// INICIALIZAÇÃO
// =====================================================================

loadStatistics();


// =====================================================================
// INICIA SCANNER
// =====================================================================

async function startScanner() {

    if (
        scannerRunning ||
        startingScanner ||
        processing
    ) {
        return;
    }


    startingScanner = true;

    startButton.disabled = true;

    participantElement.style.display =
        "none";


    setStatus(
        "Abrindo câmera...",
        "info"
    );


    try {

        scanner =
            new Html5Qrcode("reader");


        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: function(width, height) {

                    const size =
                        Math.floor(
                            Math.min(
                                width,
                                height
                            ) * 0.70
                        );

                    return {
                        width: size,
                        height: size
                    };

                }

            },

            onScanSuccess,

            function() {}

        );


        scannerRunning = true;


        setStatus(
            "Aponte a câmera para o QR Code.",
            "info"
        );

    }

    catch(error) {

        console.error(error);

        scanner = null;

        scannerRunning = false;

        startButton.disabled = false;


        setStatus(
            "Não foi possível iniciar a câmera.",
            "error"
        );

    }

    finally {

        startingScanner = false;

    }

}


// =====================================================================
// QR CODE IDENTIFICADO
// =====================================================================

async function onScanSuccess(decodedText) {

    if (processing) {
        return;
    }


    processing = true;


    const uuid =
        String(decodedText || "").trim();


    await stopScanner();


    setStatus(
        "Validando acesso...",
        "info"
    );


    await validateCheckin(
        uuid,
        "scanner"
    );

}


// =====================================================================
// VALIDA CHECK-IN
// =====================================================================

async function validateCheckin(
    uuid,
    source = "scanner"
) {

    try {

        const url =
            API_URL +
            "?action=checkin&uuid=" +
            encodeURIComponent(uuid);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        if (source === "manual") {

            handleManualCheckinResult(result);

        }

        else {

            handleScannerResult(result);

        }

    }

    catch(error) {

        console.error(error);


        if (source === "manual") {

            showSearchMessage(
                "Erro de comunicação com o servidor.",
                "error"
            );

            searchButton.disabled = false;

        }

        else {

            setStatus(
                "Erro de comunicação com o servidor.",
                "error"
            );

            scheduleNextScan();

        }

    }

}


// =====================================================================
// RESULTADO DO SCANNER
// =====================================================================

function handleScannerResult(result) {

    if (result.status === "SUCCESS") {

        participantElement.textContent =
            result.nome || "";

        participantElement.style.display =
            result.nome
                ? "block"
                : "none";


        setStatus(
            "✓ ENTRADA LIBERADA",
            "success"
        );

    }


    else if (result.status === "USED") {

        let message =
            "QR CODE JÁ UTILIZADO";


        if (result.dataHora) {

            message +=
                "\nEntrada: " +
                result.dataHora;

        }


        participantElement.textContent =
            result.nome || "";

        participantElement.style.display =
            result.nome
                ? "block"
                : "none";


        setStatus(
            message,
            "warning"
        );

    }


    else if (result.status === "INVALID") {

        participantElement.style.display =
            "none";


        setStatus(
            "QR CODE INVÁLIDO",
            "error"
        );

    }


    else {

        participantElement.style.display =
            "none";


        setStatus(
            "Erro interno do sistema.",
            "error"
        );

    }


    loadStatistics();

    scheduleNextScan();

}


// =====================================================================
// ESTATÍSTICAS
// =====================================================================

async function loadStatistics() {

    try {

        const response =
            await fetch(
                API_URL +
                "?action=stats"
            );


        const result =
            await response.json();


        if (result.success) {

            checkedElement.textContent =
                result.checked;

            remainingElement.textContent =
                result.remaining;

        }

    }

    catch(error) {

        console.error(
            "Erro ao carregar estatísticas:",
            error
        );

    }

}


// =====================================================================
// PRÓXIMA LEITURA DO SCANNER
// =====================================================================

function scheduleNextScan() {

    setTimeout(
        function() {

            processing = false;

            participantElement.style.display =
                "none";


            startScanner();

        },

        2500

    );

}


// =====================================================================
// PARA O SCANNER
// =====================================================================

async function stopScanner() {

    if (
        !scanner ||
        !scannerRunning
    ) {

        scanner = null;

        scannerRunning = false;

        return;

    }


    try {

        await scanner.stop();

    }

    catch(error) {

        console.warn(error);

    }

    finally {

        scannerRunning = false;

        scanner = null;

    }

}


// =====================================================================
// STATUS VISUAL DO SCANNER
// =====================================================================

function setStatus(
    message,
    type
) {

    statusElement.className =
        type;

    statusElement.textContent =
        message;

}


// =====================================================================
// BUSCA MANUAL
// =====================================================================

async function searchParticipants() {

    const term =
        searchInput.value.trim();


    searchResults.innerHTML = "";


    if (term.length < 2) {

        showSearchMessage(
            "Digite pelo menos 2 caracteres.",
            "warning"
        );

        return;

    }


    searchButton.disabled = true;


    showSearchMessage(
        "Buscando participante...",
        "info"
    );


    try {

        const url =
            API_URL +
            "?action=search&term=" +
            encodeURIComponent(term);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Erro na busca."
            );

        }


        renderParticipants(
            result.participants || []
        );

    }

    catch(error) {

        console.error(error);


        showSearchMessage(
            "Não foi possível realizar a busca.",
            "error"
        );

    }

    finally {

        searchButton.disabled = false;

    }

}


// =====================================================================
// EXIBE RESULTADOS DA BUSCA
// =====================================================================

function renderParticipants(participants) {

    searchResults.innerHTML = "";


    if (!participants.length) {

        showSearchMessage(
            "Nenhum participante encontrado.",
            "warning"
        );

        return;

    }


    hideSearchMessage();


    participants.forEach(
        function(participant) {

            const card =
                document.createElement("div");

            card.className =
                "participant-card";


            const name =
                document.createElement("p");

            name.className =
                "participant-name";

            name.textContent =
                participant.nome;


            const status =
                document.createElement("span");

            status.className =
                "participant-status";


            const isCheckedIn =
                participant.status === "CHECK-IN";


            if (isCheckedIn) {

                status.classList.add(
                    "status-checkin"
                );

                status.textContent =
                    "CHECK-IN REALIZADO";

            }

            else {

                status.classList.add(
                    "status-pendente"
                );

                status.textContent =
                    "PENDENTE";

            }


            card.appendChild(name);

            card.appendChild(status);


            if (
                isCheckedIn &&
                participant.dataHora
            ) {

                const date =
                    document.createElement("div");

                date.className =
                    "participant-date";

                date.textContent =
                    "Entrada: " +
                    participant.dataHora;

                card.appendChild(date);

            }


            if (!isCheckedIn) {

                const button =
                    document.createElement("button");

                button.className =
                    "manual-checkin-button";

                button.textContent =
                    "CONFIRMAR ENTRADA";


                button.addEventListener(
                    "click",
                    function() {

                        manualCheckin(
                            participant,
                            button
                        );

                    }
                );


                card.appendChild(button);

            }


            searchResults.appendChild(card);

        }
    );

}


// =====================================================================
// CHECK-IN MANUAL
// =====================================================================

async function manualCheckin(
    participant,
    button
) {

    /*
     * A recepção precisa confirmar conscientemente a entrada.
     * Evita check-in acidental ao tocar no resultado errado.
     */

    const confirmed =
        window.confirm(
            "Confirmar entrada de:\n\n" +
            participant.nome +
            "?"
        );


    if (!confirmed) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "CONFIRMANDO...";


    showSearchMessage(
        "Registrando entrada...",
        "info"
    );


    await validateCheckin(
        participant.uuid,
        "manual"
    );

}


// =====================================================================
// RESULTADO DO CHECK-IN MANUAL
// =====================================================================

function handleManualCheckinResult(result) {

    searchButton.disabled = false;


    if (result.status === "SUCCESS") {

        showSearchMessage(
            "✓ Entrada liberada para " +
            (result.nome || "participante") +
            ".",
            "success"
        );


        loadStatistics();


        /*
         * Refaz a pesquisa para atualizar imediatamente
         * PENDENTE → CHECK-IN REALIZADO.
         */

        searchParticipants();

        return;

    }


    if (result.status === "USED") {

        let message =
            "Entrada já realizada";


        if (result.nome) {

            message +=
                " para " +
                result.nome;

        }


        if (result.dataHora) {

            message +=
                ". Entrada: " +
                result.dataHora;

        }


        showSearchMessage(
            message,
            "warning"
        );


        loadStatistics();

        searchParticipants();

        return;

    }


    if (result.status === "INVALID") {

        showSearchMessage(
            "Participante inválido.",
            "error"
        );

        searchParticipants();

        return;

    }


    showSearchMessage(
        "Não foi possível realizar o check-in.",
        "error"
    );

}


// =====================================================================
// MENSAGENS DA BUSCA
// =====================================================================

function showSearchMessage(
    message,
    type
) {

    searchMessage.style.display =
        "block";

    searchMessage.className =
        type;

    searchMessage.textContent =
        message;

}


function hideSearchMessage() {

    searchMessage.style.display =
        "none";

    searchMessage.textContent =
        "";

}

</script>

</body>

</html>
