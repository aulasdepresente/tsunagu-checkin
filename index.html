<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TSUNAGU</title>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 18px;
            background: #0F172A;
            color: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 4px;
        }

        .header p {
            margin: 8px 0 0;
            color: #CBD5E1;
        }

        .scanner-card {
            padding: 16px;
            background: #1E293B;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.30);
        }

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 14px;
            background: #000;
        }

        #status {
            margin-top: 18px;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.4;
            background: #2563EB;
        }

        #participant {
            display: none;
            margin-top: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .info {
            background: #2563EB !important;
        }

        .success {
            background: #16A34A !important;
        }

        .warning {
            background: #D97706 !important;
        }

        .error {
            background: #DC2626 !important;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
        }

        .stat {
            padding: 20px 10px;
            background: #1E293B;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #38BDF8;
        }

        .stat-label {
            display: block;
            margin-top: 6px;
            color: #CBD5E1;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: 0;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
        }

    </style>

</head>


<body>

<main class="container">

    <header class="header">

        <h1>TSUNAGU</h1>

        <p>Sistema Inteligente de Gestão de Acesso</p>

    </header>


    <section class="scanner-card">

        <div id="reader"></div>


        <div
            id="status"
            class="info"
        >
            Clique em INICIAR CHECK-IN.
        </div>


        <div id="participant"></div>


        <button id="startButton">
            INICIAR CHECK-IN
        </button>

    </section>


    <section class="stats">

        <div class="stat">

            <span
                id="checked"
                class="stat-number"
            >
                -
            </span>

            <span class="stat-label">
                Check-ins
            </span>

        </div>


        <div class="stat">

            <span
                id="remaining"
                class="stat-number"
            >
                -
            </span>

            <span class="stat-label">
                Restantes
            </span>

        </div>

    </section>

</main>


<script>

/***********************************************************************
 *
 * TSUNAGU
 * Interface MVP
 *
 ***********************************************************************/


// =====================================================================
// CONFIGURAÇÃO
// =====================================================================

const API_URL =
    "https://script.google.com/macros/s/AKfycbx4JU4qIUQMvT4B3eKCnZ8gd-I5VNoV2bZ1SLAAdc2rD8YyXD6_mYckYE56TauVFzbP/exec";


// =====================================================================
// ELEMENTOS
// =====================================================================

const statusElement =
    document.getElementById("status");

const participantElement =
    document.getElementById("participant");

const startButton =
    document.getElementById("startButton");

const checkedElement =
    document.getElementById("checked");

const remainingElement =
    document.getElementById("remaining");


// =====================================================================
// ESTADO
// =====================================================================

let scanner = null;

let scannerRunning = false;

let startingScanner = false;

let processing = false;


// =====================================================================
// EVENTOS
// =====================================================================

startButton.addEventListener(
    "click",
    startScanner
);


// =====================================================================
// INICIALIZAÇÃO
// =====================================================================

loadStatistics();


// =====================================================================
// SCANNER
// =====================================================================

async function startScanner() {

    if (
        scannerRunning ||
        startingScanner ||
        processing
    ) {
        return;
    }


    startingScanner = true;

    startButton.disabled = true;

    participantElement.style.display = "none";

    setStatus(
        "Abrindo câmera...",
        "info"
    );


    try {

        scanner =
            new Html5Qrcode("reader");


        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: function(width, height) {

                    const size =
                        Math.floor(
                            Math.min(
                                width,
                                height
                            ) * 0.70
                        );

                    return {
                        width: size,
                        height: size
                    };

                }

            },

            onScanSuccess,

            function() {}

        );


        scannerRunning = true;


        setStatus(
            "Aponte a câmera para o QR Code.",
            "info"
        );

    }

    catch(error) {

        console.error(error);

        scanner = null;

        scannerRunning = false;

        startButton.disabled = false;


        setStatus(
            "Não foi possível iniciar a câmera.",
            "error"
        );

    }

    finally {

        startingScanner = false;

    }

}


// =====================================================================
// QR IDENTIFICADO
// =====================================================================

async function onScanSuccess(decodedText) {

    if (processing) {
        return;
    }


    processing = true;


    const uuid =
        String(decodedText || "").trim();


    await stopScanner();


    setStatus(
        "Validando acesso...",
        "info"
    );


    await validateCheckin(uuid);

}


// =====================================================================
// COMUNICAÇÃO COM API
// =====================================================================

async function validateCheckin(uuid) {

    try {

        const url =
            API_URL +
            "?action=checkin&uuid=" +
            encodeURIComponent(uuid);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        handleResult(result);

    }

    catch(error) {

        console.error(error);


        setStatus(
            "Erro de comunicação com o servidor.",
            "error"
        );


        scheduleNextScan();

    }

}


// =====================================================================
// RESULTADO
// =====================================================================

function handleResult(result) {

    if (result.status === "SUCCESS") {

        participantElement.textContent =
            result.nome || "";

        participantElement.style.display =
            result.nome
                ? "block"
                : "none";


        setStatus(
            "✓ ENTRADA LIBERADA",
            "success"
        );

    }


    else if (result.status === "USED") {

        let message =
            "QR CODE JÁ UTILIZADO";


        if (result.dataHora) {

            message +=
                "\nEntrada: " +
                result.dataHora;

        }


        participantElement.textContent =
            result.nome || "";

        participantElement.style.display =
            result.nome
                ? "block"
                : "none";


        setStatus(
            message,
            "warning"
        );

    }


    else if (result.status === "INVALID") {

        participantElement.style.display =
            "none";


        setStatus(
            "QR CODE INVÁLIDO",
            "error"
        );

    }


    else {

        participantElement.style.display =
            "none";


        setStatus(
            "Erro interno do sistema.",
            "error"
        );

    }


    loadStatistics();

    scheduleNextScan();

}


// =====================================================================
// ESTATÍSTICAS
// =====================================================================

async function loadStatistics() {

    try {

        const response =
            await fetch(
                API_URL +
                "?action=stats"
            );


        const result =
            await response.json();


        if (result.success) {

            checkedElement.textContent =
                result.checked;

            remainingElement.textContent =
                result.remaining;

        }

    }

    catch(error) {

        console.error(
            "Erro ao carregar estatísticas:",
            error
        );

    }

}


// =====================================================================
// PRÓXIMA LEITURA
// =====================================================================

function scheduleNextScan() {

    setTimeout(
        function() {

            processing = false;

            participantElement.style.display =
                "none";


            startScanner();

        },

        2500

    );

}


// =====================================================================
// PARA SCANNER
// =====================================================================

async function stopScanner() {

    if (
        !scanner ||
        !scannerRunning
    ) {

        scanner = null;

        scannerRunning = false;

        return;

    }


    try {

        await scanner.stop();

    }

    catch(error) {

        console.warn(error);

    }

    finally {

        scannerRunning = false;

        scanner = null;

    }

}


// =====================================================================
// STATUS VISUAL
// =====================================================================

function setStatus(
    message,
    type
) {

    statusElement.className =
        type;


    statusElement.textContent =
        message;

}

</script>

</body>

</html>
